name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O worker usa o Chrome instalado na maquina; o CI nao precisa de navegador.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Testes unitarios + integracao de follow-ups contra um SQLite
      # temporario (sem Turso, Redis ou chaves de API).
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-only-not-a-real-secret
